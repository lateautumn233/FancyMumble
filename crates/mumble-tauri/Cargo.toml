[package]
name = "mumble-tauri"
version = "0.3.0"
edition = "2021"
description = "Tauri desktop & mobile GUI for mumble-protocol"
license = "MIT"

[lib]
name = "mumble_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mumble-tauri"
path = "src/main.rs"

[features]
default = []
deepfilternet-denoiser = ["mumble-protocol/deepfilternet-denoiser"]
# Production asset mode: serve the embedded `ui/dist` via the custom Tauri
# protocol instead of loading `devUrl` (localhost:1420). The Tauri CLI enables
# this automatically for `cargo tauri build`; define it here so a plain
# `cargo build/run --features custom-protocol` also produces a standalone
# binary that needs no running vite dev server (e.g. for profiling).
custom-protocol = ["tauri/custom-protocol"]
# Webview devtools (F12 + right-click "Inspect Element"). Auto-enabled in debug
# builds, but NOT in optimized profiles like `release-debug`, so expose it as a
# feature to opt in when profiling an optimized build.
devtools = ["tauri/devtools"]
# Heap profiling: replaces the global allocator with dhat's profiling
# allocator and writes `dhat-heap.json` on exit (view at
# https://nnethercote.github.io/dh_view/dh_view.html). Mutually exclusive
# with mimalloc at runtime; the dhat allocator takes priority when enabled.
dhat-heap = ["dep:dhat"]
# Native screen-share capture and hardware video encoding (Windows only).
#
# Pulls in `ffmpeg-sys-next`, which on MSVC locates FFmpeg through the
# `vcpkg` crate and needs `libclang.dll` at build time (see `TODO.md` 0.3).
# CI runners have neither, so this stays OFF by default and the encoder
# commands report `supported: false` in builds without it.
native-screenshare = ["dep:ffmpeg-sys-next", "dep:windows"]

[dependencies]
fancy-utils = { path = "../fancy-utils" }
tauri = { version = "2.10.1", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
futures-util = { version = "0.3", default-features = false }
tokio-util = { version = "0.7", features = ["io"] }
rustls = { version = "0.23", features = ["ring"] }
rcgen = "0.14.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.10"
ring = "0.17"
arc-swap = "1"
base64 = "0.22"
prost = "0.14"
zstd = "0.13"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "multipart", "stream", "json"] }
quick-xml = { version = "0.39.2", features = ["serialize"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
hound = "3.5"
chrono = "0.4"

# Desktop-only dependencies (cpal, global shortcuts, and Opus are not available on Android).
[target.'cfg(not(target_os = "android"))'.dependencies]
# Compacting allocator that returns freed pages to the OS far more
# aggressively than the Windows system heap, which otherwise holds the
# startup high-water mark (~280 MB) for the whole process lifetime.
mimalloc = { version = "0.1", default-features = false }
# Optional heap profiler, enabled only via the `dhat-heap` feature.
dhat = { version = "0.3", optional = true }
png = "0.18"
mumble-protocol = { path = "../mumble-protocol", features = ["opus-codec", "persistent-chat", "rnnoise-denoiser"] }
cpal = "0.17.3"
rodio = { version = "0.22", features = ["recording"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"
# Auto-updater (desktop only). All updater logic lives in `src/updater/`.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# WebRTC transport for native screen sharing: the broadcaster sends encoded
# frames to the server's SFU and, in P2P mode, directly to viewers.
#
# webrtc-rs rather than str0m (which the server's SFU uses) because P2P needs
# a TURN client and ICE candidate gathering, and str0m leaves both to the
# caller - see `TODO.md` "已定：广播端用 webrtc-rs". Not behind the
# `native-screenshare` feature: unlike FFmpeg this is pure Rust with no vcpkg
# or libclang requirement, so CI can build it.
webrtc = "0.20.5"
async-trait = "0.1"
# The Sans-I/O protocol core `webrtc` is built on. A direct dependency because
# the configuration types (MediaEngine, codec parameters, SDP, ICE) live here
# and `webrtc` only re-exports its error type. **The version must match
# `webrtc` exactly**: two copies would be two incompatible sets of types.
rtc = "0.20.5"
# Android: mumble-protocol with Opus codec + oboe for native audio I/O.
[target.'cfg(target_os = "android")'.dependencies]
mumble-protocol = { path = "../mumble-protocol", features = ["opus-codec", "persistent-chat", "rnnoise-denoiser"] }
oboe = "0.6.1"

# Windows-only: native window subclassing for aspect-ratio constraints
# (see crates/mumble-tauri/src/platform/window/windows.rs).
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
] }
# WebView2 COM bindings for ICoreWebView2_19::SetMemoryUsageTargetLevel
# (trim browser memory while minimized).  Versions must match the ones
# tauri/wry pull in so the COM interface types are identical.
webview2-com = "0.38"
windows-core = "0.61"

# --- `native-screenshare` feature only (Windows) ----------------------
#
# FFmpeg FFI for hardware video encoding. Version must track the FFmpeg
# major.minor installed via vcpkg (currently 8.1.2), see `TODO.md` 0.3.
ffmpeg-sys-next = { version = "8.1", default-features = false, features = [
    "avcodec",
    "avformat",
    "avfilter",
    "swscale",
    "swresample",
    "static",
], optional = true }
# DXGI enumeration and WASAPI device/process loopback for native sharing.
# Already in the tree via cpal; enable the additional Windows interfaces.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    # Per-monitor DPI awareness while enumerating outputs: without it DXGI
    # reports a DPI-scaled desktop rectangle rather than the panel's real
    # pixels, and the capture filters work in real pixels.
    "Win32_UI_HiDpi",
    "Win32_Media_Audio",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
], optional = true }

# macOS-only: NSWindow.setContentAspectRatio: for native aspect-ratio
# constraints (see crates/mumble-tauri/src/platform/window/macos.rs).
# objc2-foundation gives us NSRect / NSSize; we send AppKit messages
# through raw `AnyObject` pointers so objc2-app-kit is not needed.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }

# Linux-only: gtk_window_set_geometry_hints for native aspect-ratio
# constraints (see crates/mumble-tauri/src/platform/window/linux.rs).
# The gtk version must match the one tao/tauri pulls in (0.18).
[target.'cfg(all(unix, not(any(target_os = "android", target_os = "macos", target_os = "ios"))))'.dependencies]
gtk = { version = "0.18", default-features = false }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"
